```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギター指板トレーニング</title>
<style>
:root {
  --bg: #111318;
  --panel: #1c2029;
  --line: #414957;
  --text: #f2f4f8;
  --muted: #aab2c0;
  --accent: #66d9c1;
  --red: #ff596b;
  --yellow: #ffd166;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  color: var(--text);
  background: var(--bg);
  font-family: system-ui, -apple-system, sans-serif;
}
main { max-width: 1100px; margin: auto; }
h1 { font-size: 1.5rem; margin: 0 0 6px; }
p { line-height: 1.6; }
.sub { color: var(--muted); margin-top: 0; }
.panel {
  background: var(--panel);
  border: 1px solid #303744;
  border-radius: 12px;
  padding: 14px;
  margin: 12px 0;
}
.modes {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
button, select, input {
  font: inherit;
}
button, select {
  color: var(--text);
  background: #292f3b;
  border: 1px solid #485264;
  border-radius: 8px;
  padding: 10px 12px;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.active {
  background: #174d48;
  border-color: var(--accent);
}
button:disabled { opacity: .65; cursor: default; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
}
.control {
  display: flex;
  gap: 7px;
  align-items: center;
}
label { color: var(--muted); }
input[type="number"] {
  width: 76px;
  color: var(--text);
  background: #11151c;
  border: 1px solid #485264;
  border-radius: 7px;
  padding: 8px;
}
select { max-width: 100%; }
#question {
  font-size: 1.15rem;
  font-weight: 700;
  margin: 8px 0;
}
#message { min-height: 1.6em; color: var(--muted); }
.answers {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 12px;
}
.answer-btn { min-width: 50px; }
.answer-btn.correct, .cell.correct {
  background-color: #17664d !important;
  border-color: #6af0b4 !important;
}
.answer-btn.wrong, .cell.wrong {
  background-color: #792e3a !important;
  border-color: #ff7787 !important;
}
.hidden { display: none !important; }

/* 番号と指板を同じスクロール領域に収める */
.fret-scroll {
  width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 10px;
  -webkit-overflow-scrolling: touch;
}
.fret-layout {
  width: max-content;
  min-width: 100%;
}
.fret-header, .fretboard {
  display: grid;
  grid-template-columns: 44px repeat(var(--frets), 44px);
  width: max-content;
}
.fret-header {
  position: relative;
  margin-bottom: 4px;
}
.fret-number {
  height: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--muted);
  font-size: .85rem;
}
.fret-number.nut-number {
  border-left: 4px solid #d4d8df;
}
.string-label {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  min-height: 43px;
  color: var(--accent);
  font-size: .88rem;
  font-weight: 700;
  background: #202631;
  border-right: 1px solid #343c49;
}
.cell {
  width: 44px;
  height: 43px;
  padding: 0;
  border-radius: 0;
  border: 0;
  border-bottom: 1px solid #68707b;
  border-right: 1px solid #3e4653;
  background: #272d37;
  color: var(--text);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  overflow: hidden;
}
.cell:nth-child(even) { background-color: #242a33; }
.cell.nut { border-left: 4px solid #d4d8df; }
.cell.inlay::before {
  content: "";
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #77808d;
  opacity: .65;
  z-index: 0;
}
.cell.double-inlay::before {
  width: 7px;
  height: 7px;
  top: 8px;
}
.cell.double-inlay::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #77808d;
  opacity: .65;
  bottom: 8px;
}
.cell .note {
  position: relative;
  z-index: 1;
  pointer-events: none;
  font-size: .78rem;
}
.cell.scale-tone {
  background: #174b46 !important;
  color: #e5fff8;
}
.cell.root-tone {
  background: #7b5a18 !important;
  color: #fff5d4;
}
.cell.target {
  background: #522b39 !important;
  outline: 2px solid var(--red);
  outline-offset: -3px;
  z-index: 2;
}
.cell.target::after {
  content: "";
  position: absolute;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 2px solid white;
  background: var(--red);
  z-index: 2;
  box-shadow: 0 0 9px #ff596b;
}
.cell.target .note { color: white; }
.cell.selected {
  outline: 2px solid var(--yellow);
  outline-offset: -3px;
  background: #54461d !important;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  color: var(--muted);
  font-size: .85rem;
  margin-top: 8px;
}
.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-right: 5px;
}
.dot.root { background: var(--yellow); }
.dot.scale { background: var(--accent); }
.dot.target { background: var(--red); }
.small { color: var(--muted); font-size: .9rem; }
@media (max-width: 520px) {
  body { padding: 10px; }
  .panel { padding: 10px; }
  .fret-header, .fretboard {
    grid-template-columns: 38px repeat(var(--frets), 40px);
  }
  .string-label { width: 38px; }
  .cell { width: 40px; height: 40px; }
  .fret-number { font-size: .8rem; }
  .modes { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <h1>ギター指板トレーニング</h1>
  <p class="sub">6弦ギター・レギュラーチューニング専用</p>

  <section class="panel">
    <div class="controls">
      <div class="control">
        <label for="maxFret">最大フレット</label>
        <input id="maxFret" type="number" min="0" max="24" value="12">
      </div>
      <button id="newQuestion">次の問題</button>
      <button id="showAnswer">答えを見る</button>
    </div>
    <p class="small">フレット数を変更すると、上の番号と指板が一緒に更新されます。指板は横にスクロールできます。</p>
  </section>

  <section class="panel">
    <div class="modes">
      <button class="mode-btn active" data-mode="position">① 位置の音名当て</button>
      <button class="mode-btn" data-mode="find">② 音名の位置探し</button>
      <button class="mode-btn" data-mode="scaleFind">③ スケールの位置探し</button>
      <button class="mode-btn" data-mode="scaleIdentify">④ スケール判別</button>
    </div>
  </section>

  <section class="panel">
    <div id="question"></div>
    <div id="message" aria-live="polite"></div>
    <div id="extraControls" class="controls"></div>
    <div id="answers" class="answers"></div>
  </section>

  <section class="panel">
    <div class="fret-scroll" id="fretScroll">
      <div class="fret-layout" id="fretLayout">
        <div class="fret-header" id="fretHeader"></div>
        <div class="fretboard" id="fretboard"></div>
      </div>
    </div>
    <div class="legend" id="legend">
      <span><i class="dot target"></i>問題の位置</span>
      <span><i class="dot root"></i>ルート音</span>
      <span><i class="dot scale"></i>スケール構成音</span>
    </div>
    <p class="small">上から1弦・2弦・3弦・4弦・5弦・6弦です。0は開放弦です。12フレットでは同じ音名が1オクターブ上になります。</p>
  </section>
</main>

<script>
const NOTE_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const STRINGS = [
  { name: "1弦 E", midi: 64 },
  { name: "2弦 B", midi: 59 },
  { name: "3弦 G", midi: 55 },
  { name: "4弦 D", midi: 50 },
  { name: "5弦 A", midi: 45 },
  { name: "6弦 E", midi: 40 }
];
const SCALES = {
  "メジャー": [0, 2, 4, 5, 7, 9, 11],
  "ナチュラルマイナー": [0, 2, 3, 5, 7, 8, 10],
  "ハーモニックマイナー": [0, 2, 3, 5, 7, 8, 11]
};

const maxFretInput = document.getElementById("maxFret");
const fretHeader = document.getElementById("fretHeader");
const fretboard = document.getElementById("fretboard");
const fretLayout = document.getElementById("fretLayout");
const questionEl = document.getElementById("question");
const messageEl = document.getElementById("message");
const answersEl = document.getElementById("answers");
const extraControls = document.getElementById("extraControls");
const newQuestionBtn = document.getElementById("newQuestion");
const showAnswerBtn = document.getElementById("showAnswer");
const legendEl = document.getElementById("legend");

let mode = "position";
let maxFret = 12;
let question = {};
let answered = false;
let selectedCells = new Set();
let correctCells = new Set();
let cellButtons = new Map();
let rootSelect, scaleSelect;

function noteAt(stringIndex, fret) {
  return NOTE_NAMES[(STRINGS[stringIndex].midi + fret) % 12];
}
function noteIndex(note) {
  return NOTE_NAMES.indexOf(note);
}
function randomInt(n) {
  return Math.floor(Math.random() * n);
}
function randomNote() {
  return NOTE_NAMES[randomInt(NOTE_NAMES.length)];
}
function cellKey(s, f) {
  return `${s}-${f}`;
}
function allCells() {
  const result = [];
  STRINGS.forEach((str, s) => {
    for (let f = 0; f <= maxFret; f++) {
      result.push({ s, f, note: noteAt(s, f) });
    }
  });
  return result;
}
function scaleNotes(root, scaleName) {
  const rootIdx = noteIndex(root);
  return SCALES[scaleName].map(interval => NOTE_NAMES[(rootIdx + interval) % 12]);
}
function currentScaleNotes() {
  return scaleNotes(question.root, question.scaleName);
}

function buildBoard() {
  maxFret = Math.max(0, Math.min(24, Number(maxFretInput.value) || 0));
  maxFretInput.value = maxFret;

  // ヘッダーと指板を同じ幅・同じ列定義にする
  const columns = `44px repeat(${maxFret + 1}, 44px)`;
  fretHeader.style.gridTemplateColumns = columns;
  fretboard.style.gridTemplateColumns = columns;
  fretHeader.style.setProperty("--frets", maxFret + 1);
  fretboard.style.setProperty("--frets", maxFret + 1);
  fretLayout.style.setProperty("--frets", maxFret + 1);

  fretHeader.innerHTML = "";
  fretboard.innerHTML = "";
  cellButtons.clear();

  const blank = document.createElement("div");
  blank.className = "fret-number";
  blank.textContent = "弦";
  fretHeader.appendChild(blank);

  for (let f = 0; f <= maxFret; f++) {
    const label = document.createElement("div");
    label.className = "fret-number" + (f === 0 ? " nut-number" : "");
    label.textContent = f;
    fretHeader.appendChild(label);
  }

  STRINGS.forEach((str, s) => {
    const stringLabel = document.createElement("div");
    stringLabel.className = "string-label";
    stringLabel.textContent = str.name;
    fretboard.appendChild(stringLabel);

    for (let f = 0; f <= maxFret; f++) {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      if (f === 0) cell.classList.add("nut");
      if ([3, 5, 7, 9, 15, 17, 19, 21].includes(f)) cell.classList.add("inlay");
      if ([12, 24].includes(f)) cell.classList.add("double-inlay");
      cell.dataset.string = s;
      cell.dataset.fret = f;
      cell.setAttribute("aria-label", `${str.name} ${f}フレット`);
      cell.innerHTML = '<span class="note"></span>';
      cell.addEventListener("click", () => onCellClick(s, f));
      fretboard.appendChild(cell);
      cellButtons.set(cellKey(s, f), cell);
    }
  });

  refreshBoard();
}

function refreshBoard() {
  const scaleMode = mode === "scaleFind" || mode === "scaleIdentify";
  const notes = scaleMode && question.root ? currentScaleNotes() : [];
  const root = question.root;

  cellButtons.forEach((cell, key) => {
    const [s, f] = key.split("-").map(Number);
    const note = noteAt(s, f);
    const isTarget = mode === "position" && question.s === s && question.f === f;
    const isScaleNote = scaleMode && notes.includes(note);
    const isRoot = scaleMode && note === root;

    cell.classList.remove("target", "scale-tone", "root-tone", "selected", "correct", "wrong");

    if (isTarget) cell.classList.add("target");
    if (isScaleNote) cell.classList.add("scale-tone");
    if (isRoot) cell.classList.add("root-tone");
    if (selectedCells.has(key)) cell.classList.add("selected");
    if (correctCells.has(key)) cell.classList.add("correct");

    const noteSpan = cell.querySelector(".note");
    // 通常は音名を隠し、答えを表示したときだけ表示する
    if (answered && (mode === "position" || mode === "scaleIdentify")) {
      noteSpan.textContent = note;
    } else if (answered && (mode === "find" || mode === "scaleFind")) {
      noteSpan.textContent = note;
    } else {
      noteSpan.textContent = "";
    }

    // ④では問題としてスケール全体の構成音を表示する
    if (mode === "scaleIdentify" && isScaleNote) {
      noteSpan.textContent = note;
    }
  });
}

function setQuestion(text) {
  questionEl.textContent = text;
  messageEl.textContent = "";
  answersEl.innerHTML = "";
  answered = false;
  selectedCells = new Set();
  correctCells = new Set();
  refreshBoard();
}

function addAnswerButton(text, onClick) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "answer-btn";
  btn.textContent = text;
  btn.addEventListener("click", onClick);
  answersEl.appendChild(btn);
  return btn;
}

function setupExtraControls() {
  extraControls.innerHTML = "";
  rootSelect = null;
  scaleSelect = null;

  if (mode === "scaleFind" || mode === "scaleIdentify") {
    const rootLabel = document.createElement("label");
    rootLabel.textContent = "ルート音";
    rootSelect = document.createElement("select");
    NOTE_NAMES.forEach(note => {
      const opt = document.createElement("option");
      opt.value = note;
      opt.textContent = note;
      rootSelect.appendChild(opt);
    });
    rootSelect.value = question.root || "C";
    rootSelect.addEventListener("change", () => {
      question.root = rootSelect.value;
      refreshBoard();
      if (mode === "scaleFind") newQuestion();
      if (mode === "scaleIdentify") newQuestion();
    });
    extraControls.append(rootLabel, rootSelect);
  }

  if (mode === "scaleFind") {
    const scaleLabel = document.createElement("label");
    scaleLabel.textContent = "スケール";
    scaleSelect = document.createElement("select");
    Object.keys(SCALES).forEach(name => {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      scaleSelect.appendChild(opt);
    });
    scaleSelect.value = question.scaleName || "メジャー";
    scaleSelect.addEventListener("change", () => {
      question.scaleName = scaleSelect.value;
      newQuestion();
    });
    extraControls.append(scaleLabel, scaleSelect);
  }
}

function newQuestion() {
  answered = false;
  selectedCells = new Set();
  correctCells = new Set();
  answersEl.innerHTML = "";
  messageEl.textContent = "";
  setupExtraControls();

  if (mode === "position") {
    question.s = randomInt(6);
    question.f = randomInt(maxFret + 1);
    setQuestion("この赤い位置の音名は？");
    ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"].forEach(note => {
      addAnswerButton(note, () => {
        const correct = note === noteAt(question.s, question.f);
        answered = true;
        refreshBoard();
        messageEl.textContent = correct
          ? "正解です。"
          : `不正解。正解は ${noteAt(question.s, question.f)} です。`;
        markAnswerButtons(note, noteAt(question.s, question.f));
      });
    });
  }

  if (mode === "find") {
    question.note = randomNote();
    setQuestion(`指板上で「${question.note}」の位置をすべて選んでください。`);
    messageEl.textContent = "該当する位置をタップしてから「答え合わせ」を押してください。";
    addAnswerButton("答え合わせ", checkFindAnswer);
  }

  if (mode === "scaleFind") {
    question.root = rootSelect ? rootSelect.value : (question.root || "C");
    question.scaleName = scaleSelect ? scaleSelect.value : (question.scaleName || "メジャー");
    if (rootSelect) rootSelect.value = question.root;
    if (scaleSelect) scaleSelect.value = question.scaleName;
    setQuestion(`${question.root} ${question.scaleName} の構成音をすべて選んでください。`);
    messageEl.textContent = "緑色の表示は使わず、音の配置を自分で考えて選択します。";
    addAnswerButton("答え合わせ", checkScaleFindAnswer);
    refreshBoard();
  }

  if (mode === "scaleIdentify") {
    question.root = question.root || randomNote();
    question.scaleName = Object.keys(SCALES)[randomInt(Object.keys(SCALES).length)];
    if (rootSelect) rootSelect.value = question.root;
    setQuestion(`この指板上の音の並びは、${question.root} をルートとする何のスケール？`);
    messageEl.textContent = "表示されている構成音の並びからスケールを判別してください。";
    Object.keys(SCALES).forEach(name => {
      addAnswerButton(name, () => {
        const correct = name === question.scaleName;
        answered = true;
        refreshBoard();
        messageEl.textContent = correct
          ? `正解です。${question.root} ${question.scaleName} です。`
          : `不正解。正解は ${question.root} ${question.scaleName} です。`;
        [...answersEl.querySelectorAll("button")].forEach(btn => {
          btn.disabled = true;
          if (btn.textContent === question.scaleName) btn.classList.add("correct");
          else if (btn.textContent === name) btn.classList.add("wrong");
        });
      });
    });
    refreshBoard();
  }
}

function markAnswerButtons(chosen, correct) {
  [...answersEl.querySelectorAll("button")].forEach(btn => {
    if (btn.textContent === correct) btn.classList.add("correct");
    else if (btn.textContent === chosen) btn.classList.add("wrong");
    btn.disabled = true;
  });
}

function onCellClick(s, f) {
  const key = cellKey(s, f);

  if (mode === "position" || mode === "scaleIdentify") return;
  if (answered) return;

  if (selectedCells.has(key)) selectedCells.delete(key);
  else selectedCells.add(key);

  refreshBoard();
}

function checkFindAnswer() {
  const correct = new Set();
  allCells().forEach(({s, f, note}) => {
    if (note === question.note) correct.add(cellKey(s, f));
  });
  checkSelected(correct);
}

function checkScaleFindAnswer() {
  const correct = new Set();
  const notes = currentScaleNotes();
  allCells().forEach(({s, f, note}) => {
    if (notes.includes(note)) correct.add(cellKey(s, f));
  });
  checkSelected(correct);
}

function checkSelected(correct) {
  answered = true;
  correctCells = correct;
  refreshBoard();

  let allCorrect = selectedCells.size === correct.size;
  selectedCells.forEach(key => {
    if (!correct.has(key)) allCorrect = false;
  });

  messageEl.textContent = allCorrect
    ? "正解です。すべての位置を選べています。"
    : `まだ違いがあります。正しい位置は ${correct.size} か所です。`;
  correct.forEach(key => {
    const cell = cellButtons.get(key);
    if (cell) cell.classList.add("correct");
  });
  selectedCells.forEach(key => {
    if (!correct.has(key)) {
      const cell = cellButtons.get(key);
      if (cell) cell.classList.add("wrong");
    }
  });
}

function showAnswer() {
  if (mode === "position") {
    answered = true;
    refreshBoard();
    messageEl.textContent = `正解は ${noteAt(question.s, question.f)} です。`;
  } else if (mode === "find") {
    const correct = new Set();
    allCells().forEach(({s, f, note}) => {
      if (note === question.note) correct.add(cellKey(s, f));
    });
    answered = true;
    correctCells = correct;
    refreshBoard();
    messageEl.textContent = `「${question.note}」は ${correct.size} か所あります。`;
  } else if (mode === "scaleFind") {
    const correct = new Set();
    const notes = currentScaleNotes();
    allCells().forEach(({s, f, note}) => {
      if (notes.includes(note)) correct.add(cellKey(s, f));
    });
    answered = true;
    correctCells = correct;
    refreshBoard();
    messageEl.textContent = `${question.root} ${question.scaleName} の構成音は ${notes.join("・")} です。`;
  } else if (mode === "scaleIdentify") {
    answered = true;
    refreshBoard();
    messageEl.textContent = `正解は ${question.root} ${question.scaleName} です。構成音：${currentScaleNotes().join("・")}`;
  }
}

function changeMode(newMode) {
  mode = newMode;
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });

  // モードごとに問題設定を初期化
  question = {};
  if (mode === "scaleFind" || mode === "scaleIdentify") {
    question.root = randomNote();
    question.scaleName = "メジャー";
  }

  legendEl.classList.toggle("hidden", mode === "find");
  newQuestion();
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => changeMode(btn.dataset.mode));
});
newQuestionBtn.addEventListener("click", newQuestion);
showAnswerBtn.addEventListener("click", showAnswer);
maxFretInput.addEventListener("change", () => {
  buildBoard();
  newQuestion();
});
maxFretInput.addEventListener("input", () => {
  const val = Number(maxFretInput.value);
  if (maxFretInput.value !== "" && val >= 0 && val <= 24) {
    buildBoard();
    newQuestion();
  }
});

buildBoard();
newQuestion();
</script>
</body>
</html>
