```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギター指板トレーナー</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  background: #17191e; color: #f1f1f1;
  font-family: system-ui, sans-serif;
}
main { max-width: 1150px; margin: auto; }
h1 { font-size: 24px; }
button, select, input {
  font: inherit; padding: 9px 11px;
  border-radius: 8px; border: 1px solid #555;
}
button { cursor: pointer; background: #343944; color: white; }
button.active { background: #a72e3a; border-color: #e45b5b; }
button:disabled { opacity: .4; cursor: default; }
.modes { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.settings {
  display: flex; flex-wrap: wrap; align-items: end;
  gap: 12px; padding: 14px; margin: 14px 0;
  background: #22252c; border-radius: 12px;
}
.field { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 13px; color: #c3c6ce; }
input, select { background: #121419; color: white; max-width: 100%; }
#question { font-size: 20px; font-weight: 700; margin: 20px 0 8px; }
#instructions { color: #c3c6ce; line-height: 1.6; }
#boardWrap { overflow-x: auto; margin: 16px 0; }
#board, #fretHeader {
  display: grid;
  grid-template-columns: 54px repeat(25, 42px);
  width: max-content;
}
#board {
  grid-template-rows: repeat(6, 48px);
  background: #d7b17c;
  border: 3px solid #8e6843;
  border-radius: 5px;
}
#fretHeader {
  color: #d2d5dd; font-size: 12px;
  text-align: center; margin-bottom: 3px;
}
#fretHeader span { padding: 4px 0; }
.stringLabel {
  display: flex; align-items: center; justify-content: center;
  color: white; background: #252932; font-size: 12px;
}
.cell {
  display: flex; align-items: center; justify-content: center;
  padding: 0; min-width: 0; border-radius: 0;
  background: transparent; color: #171717;
  border-right: 1px solid #795c3c;
  border-bottom: 1px solid #795c3c;
}
.cell.open { border-right: 4px solid #f0d9ad; }
.cell:disabled { opacity: 1; }
.cell.selected { background: #397cbd; color: white; }
.cell.correct { background: #398c60; color: white; }
.cell.wrong { background: #b83232; color: white; }
.cell .note {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%;
  font-size: 12px; font-weight: 700;
}
.cell.selected .note, .cell.correct .note, .cell.wrong .note {
  background: rgba(0,0,0,.18);
}
.actions { display: flex; gap: 9px; flex-wrap: wrap; margin: 14px 0; }
#status { min-height: 28px; margin: 12px 0; font-weight: 700; }
#choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
#choices button { min-width: 48px; }
.hint { color: #aeb3bd; font-size: 13px; line-height: 1.6; }
[hidden] { display: none !important; }
@media(max-width: 600px) {
  body { padding: 10px; }
  h1 { font-size: 21px; }
  .modes button { flex: 1 1 45%; }
  .settings { gap: 10px; }
}
</style>
</head>
<body>
<main>
<h1>ギター指板トレーナー</h1>

<div class="modes">
  <button data-mode="position" class="active">① 位置の音名当て</button>
  <button data-mode="find">② 音名の位置探し</button>
  <button data-mode="scaleFind">③ スケールの位置探し</button>
  <button data-mode="scaleNote">④ スケールの音名当て</button>
</div>

<div class="settings">
  <div class="field">
    <label for="maxFret">出題する最高フレット</label>
    <input id="maxFret" type="number" min="0" max="24" value="5">
  </div>

  <div class="field" id="noteField">
    <label for="targetNote">探す音名</label>
    <select id="targetNote"></select>
  </div>

  <div class="field" id="rootField" hidden>
    <label for="rootNote">キー（主音）</label>
    <select id="rootNote"></select>
  </div>

  <div class="field" id="scaleField" hidden>
    <label for="scaleType">スケール</label>
    <select id="scaleType">
      <option value="major">メジャー</option>
      <option value="minor">ナチュラルマイナー</option>
      <option value="harmonicMinor">ハーモニックマイナー</option>
    </select>
  </div>
</div>

<div id="question"></div>
<div id="instructions"></div>

<div id="fretHeader"></div>
<div id="boardWrap"><div id="board"></div></div>

<div id="choices"></div>

<div class="actions">
  <button id="checkBtn">答え合わせ</button>
  <button id="newBtn">次の問題</button>
  <button id="showBtn">答えを表示</button>
</div>

<div id="status" aria-live="polite"></div>
<p class="hint">
  指板はTAB譜と同じく上から1弦、2弦……6弦です。フレット範囲は0〜指定した最高フレットです。指板は横にスクロールできます。
</p>
</main>

<script>
const NOTES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];

const STRINGS = [
  { name: "1弦 E", midi: 64 },
  { name: "2弦 B", midi: 59 },
  { name: "3弦 G", midi: 55 },
  { name: "4弦 D", midi: 50 },
  { name: "5弦 A", midi: 45 },
  { name: "6弦 E", midi: 40 }
];

const SCALES = {
  major: { name: "メジャー", intervals: [0,2,4,5,7,9,11] },
  minor: { name: "ナチュラルマイナー", intervals: [0,2,3,5,7,8,10] },
  harmonicMinor: { name: "ハーモニックマイナー", intervals: [0,2,3,5,7,8,11] }
};

const $ = id => document.getElementById(id);
const board = $("board");
const header = $("fretHeader");
const status = $("status");
const question = $("question");
const instructions = $("instructions");
const maxFretInput = $("maxFret");

let mode = "position";
let selected = new Set();
let answerSet = new Set();
let target = null;
let answered = false;

function fillNotes(select) {
  NOTES.forEach(note => {
    const option = document.createElement("option");
    option.value = note;
    option.textContent = note;
    select.appendChild(option);
  });
}
fillNotes($("targetNote"));
fillNotes($("rootNote"));
$("targetNote").value = "E";
$("rootNote").value = "C";

function limitFret() {
  const n = Number.parseInt(maxFretInput.value, 10);
  return Number.isFinite(n) ? Math.max(0, Math.min(24, n)) : 5;
}

function keyOf(s, f) {
  return `${s}-${f}`;
}

function pitchClass(s, f) {
  return (STRINGS[s].midi + f) % 12;
}

function noteAt(s, f) {
  return NOTES[pitchClass(s, f)];
}

function allPositions() {
  const result = [];
  for (let s = 0; s < 6; s++) {
    for (let f = 0; f <= limitFret(); f++) {
      result.push({ s, f, key: keyOf(s, f) });
    }
  }
  return result;
}

function scalePitchClasses() {
  const root = NOTES.indexOf($("rootNote").value);
  return new Set(SCALES[$("scaleType").value].intervals.map(i => (root + i) % 12));
}

function expectedPositions() {
  const positions = allPositions();

  if (mode === "find") {
    const pc = NOTES.indexOf($("targetNote").value);
    return new Set(positions.filter(p => pitchClass(p.s, p.f) === pc).map(p => p.key));
  }

  if (mode === "scaleFind") {
    const pcs = scalePitchClasses();
    return new Set(positions.filter(p => pcs.has(pitchClass(p.s, p.f))).map(p => p.key));
  }

  if (mode === "scaleNote") {
    const pcs = scalePitchClasses();
    return new Set(positions.filter(p => pcs.has(pitchClass(p.s, p.f))).map(p => p.key));
  }

  return new Set();
}

function buildBoard() {
  board.innerHTML = "";
  header.innerHTML = "<span></span>";

  for (let f = 0; f <= 24; f++) {
    const span = document.createElement("span");
    span.textContent = f;
    header.appendChild(span);
  }

  STRINGS.forEach((string, s) => {
    const label = document.createElement("div");
    label.className = "stringLabel";
    label.textContent = string.name;
    board.appendChild(label);

    for (let f = 0; f <= 24; f++) {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell" + (f === 0 ? " open" : "");
      cell.dataset.key = keyOf(s, f);
      cell.dataset.s = s;
      cell.dataset.f = f;

      const note = document.createElement("span");
      note.className = "note";
      cell.appendChild(note);

      cell.addEventListener("click", () => handleCell(cell));
      board.appendChild(cell);
    }
  });
}

function refreshBoard() {
  document.querySelectorAll(".cell").forEach(cell => {
    const s = Number(cell.dataset.s);
    const f = Number(cell.dataset.f);
    const key = cell.dataset.key;
    const note = cell.querySelector(".note");

    cell.classList.remove("selected", "correct", "wrong");
    cell.style.visibility = f <= limitFret() ? "visible" : "hidden";
    cell.disabled = f > limitFret();

    // 位置当てモードでは隠す。選択式では、答えのヒントを出さないため隠す。
    // 答えを表示した後は、答え合わせの色と音名を見られる。
    const reveal = answered;
    note.textContent = reveal ? noteAt(s, f) : "";

    if (selected.has(key)) cell.classList.add("selected");
  });
}

function handleCell(cell) {
  if (answered || cell.disabled) return;

  const s = Number(cell.dataset.s);
  const f = Number(cell.dataset.f);
  const key = cell.dataset.key;

  if (mode === "position" || mode === "scaleNote") {
    const correct = mode === "position"
      ? noteAt(s, f) === target.note
      : scalePitchClasses().has(pitchClass(s, f)) &&
        noteAt(s, f) === target.note;

    // 音名当てではクリックした位置の音名を選択肢で回答するため、
    // 指板自体をクリックしても回答にはしない。
    status.textContent = `選択した位置：${s + 1}弦 ${f}フレット`;
    return;
  }

  if (selected.has(key)) selected.delete(key);
  else selected.add(key);

  refreshBoard();
  status.textContent = `選択中：${selected.size}か所`;
}

function updateModeUI() {
  document.querySelectorAll("[data-mode]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });

  $("noteField").hidden = !["find"].includes(mode);
  $("rootField").hidden = !["scaleFind", "scaleNote"].includes(mode);
  $("scaleField").hidden = !["scaleFind", "scaleNote"].includes(mode);

  $("checkBtn").hidden = !["find", "scaleFind"].includes(mode);
  $("choices").hidden = !["position", "scaleNote"].includes(mode);

  newQuestion();
}

function newQuestion() {
  selected.clear();
  answered = false;
  status.textContent = "";
  status.style.color = "#f1f1f1";
  $("choices").innerHTML = "";

  const positions = allPositions();
  const randomPosition = () => positions[Math.floor(Math.random() * positions.length)];

  if (mode === "position") {
    target = randomPosition();
    question.textContent = "この位置は何の音？";
    instructions.textContent = `${target.s + 1}弦 ${target.f}フレットの音名を選んでください。指板上の音名は表示されません。`;
    addNoteChoices(NOTES);
  } else if (mode === "find") {
    question.textContent = `${$("targetNote").value} はどこにある？`;
    instructions.textContent = `0〜${limitFret()}フレットから、該当する位置をすべて選んでください。`;
  } else if (mode === "scaleFind") {
    const scale = SCALES[$("scaleType").value];
    question.textContent = `${$("rootNote").value} ${scale.name} の音はどこ？`;
    instructions.textContent = `0〜${limitFret()}フレットから、スケールに含まれる音をすべて選んでください。音名は隠されています。`;
  } else {
    const pcs = scalePitchClasses();
    const candidates = positions.filter(p => pcs.has(pitchClass(p.s, p.f)));
    target = candidates[Math.floor(Math.random() * candidates.length)];
    question.textContent = "この位置の音名は？（スケール練習）";
    instructions.textContent = `${$("rootNote").value} ${SCALES[$("scaleType").value].name} のスケール内の音です。${target.s + 1}弦 ${target.f}フレットの音名を選んでください。`;
    addNoteChoices(NOTES);
  }

  answerSet = expectedPositions();
  refreshBoard();
}

function addNoteChoices(notes) {
  const choices = $("choices");
  notes.forEach(note => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = note;
    button.addEventListener("click", () => {
      if (answered) return;

      let correct;
      if (mode === "position") {
        correct = note === noteAt(target.s, target.f);
      } else {
        correct = note === noteAt(target.s, target.f);
      }

      answered = true;
      refreshBoard();
      status.style.color = correct ? "#72dfa0" : "#ffb1a8";
      status.textContent = correct
        ? "正解！"
        : `不正解。正解は ${noteAt(target.s, target.f)} です。`;
    });
    choices.appendChild(button);
  });
}

function checkAnswer() {
  if (answered || !["find", "scaleFind"].includes(mode)) return;

  const missing = [...answerSet].filter(key => !selected.has(key));
  const extra = [...selected].filter(key => !answerSet.has(key));

  if (missing.length === 0 && extra.length === 0) {
    answered = true;
    status.style.color = "#72dfa0";
    status.textContent = `正解！ ${answerSet.size}か所すべて見つかりました。`;
    refreshBoard();
    return;
  }

  status.style.color = "#ffb1a8";
  status.textContent = `まだ違います。見落とし ${missing.length}か所、余分な選択 ${extra.length}か所です。`;
  document.querySelectorAll(".cell").forEach(cell => {
    const key = cell.dataset.key;
    if (missing.includes(key)) cell.classList.add("correct");
    if (extra.includes(key)) cell.classList.add("wrong");
  });
}

function showAnswer() {
  answered = true;
  if (mode === "position" || mode === "scaleNote") {
    refreshBoard();
    status.style.color = "#72dfa0";
    status.textContent = `正解は ${noteAt(target.s, target.f)} です。`;
    return;
  }

  document.querySelectorAll(".cell").forEach(cell => {
    cell.classList.remove("selected", "correct", "wrong");
    if (answerSet.has(cell.dataset.key)) cell.classList.add("correct");
  });
  refreshBoard();
  document.querySelectorAll(".cell").forEach(cell => {
    if (answerSet.has(cell.dataset.key)) cell.classList.add("correct");
  });

  status.style.color = "#72dfa0";
  status.textContent = `正解は ${answerSet.size}か所です。緑色の位置を確認してください。`;
}

document.querySelectorAll("[data-mode]").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    updateModeUI();
  });
});

$("checkBtn").addEventListener("click", checkAnswer);
$("newBtn").addEventListener("click", newQuestion);
$("showBtn").addEventListener("click", showAnswer);

[$("targetNote"), $("rootNote"), $("scaleType"), maxFretInput].forEach(el => {
  el.addEventListener("change", newQuestion);
});

buildBoard();
updateModeUI();
</script>
</body>
</html>
