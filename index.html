```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギター指板トレーナー</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 18px;
  background: #17191e; color: #f1f1f1;
  font-family: system-ui, sans-serif;
}
main { max-width: 1100px; margin: auto; }
h1 { font-size: 25px; }
button, select, input {
  font: inherit; padding: 9px 12px;
  border-radius: 8px; border: 1px solid #555;
}
button { cursor: pointer; color: white; background: #343944; }
button.active { background: #b83232; border-color: #e45b5b; }
button:disabled { opacity: .4; cursor: default; }
.settings {
  display: flex; flex-wrap: wrap; align-items: end;
  gap: 12px; padding: 14px; margin: 14px 0;
  background: #22252c; border-radius: 12px;
}
.field { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 13px; color: #c3c6ce; }
input, select { background: #121419; color: white; max-width: 100%; }
.mode-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
#question { font-size: 19px; font-weight: 700; margin: 20px 0 8px; }
#instructions { color: #c3c6ce; line-height: 1.6; }
#boardWrap { overflow-x: auto; margin: 20px 0; }
#board {
  display: grid;
  grid-template-columns: 52px repeat(25, 42px);
  grid-template-rows: repeat(6, 48px);
  width: max-content;
  background: #d7b17c;
  border: 3px solid #8e6843;
  border-radius: 5px;
}
.stringLabel {
  display: flex; align-items: center; justify-content: center;
  color: #fff; background: #252932; font-size: 13px;
}
.cell {
  position: relative; display: flex; align-items: center;
  justify-content: center; border-right: 1px solid #795c3c;
  border-bottom: 1px solid #795c3c; cursor: pointer;
  color: #171717; min-width: 0; padding: 0;
  border-radius: 0; background: transparent;
}
.cell.open { background: #d2a66c; border-right: 4px solid #f0d9ad; }
.cell.selected { background: #398c60; color: white; }
.cell.correct { background: #398c60; color: white; }
.cell.wrong { background: #b83232; color: white; }
.cell .note {
  z-index: 1; font-size: 12px; font-weight: 700;
  border-radius: 50%; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
}
.cell.selected .note, .cell.correct .note, .cell.wrong .note {
  background: rgba(0,0,0,.18);
}
.fretHeader {
  display: grid; grid-template-columns: 52px repeat(25, 42px);
  width: max-content; margin-bottom: 3px; color: #d2d5dd;
  font-size: 12px; text-align: center;
}
.fretHeader span { padding: 4px 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
#status { min-height: 28px; font-weight: 700; margin: 12px 0; }
#noteChoices { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
#noteChoices button { min-width: 48px; }
.hint { font-size: 13px; color: #aeb3bd; }
@media (max-width: 600px) {
  body { padding: 12px; }
  h1 { font-size: 21px; }
  .settings { gap: 10px; }
}
</style>
</head>
<body>
<main>
  <h1>ギター指板トレーナー</h1>

  <div class="mode-buttons">
    <button id="noteMode" class="active">音名を探す</button>
    <button id="scaleMode">スケールを探す</button>
  </div>

  <div class="settings">
    <div class="field">
      <label for="maxFret">何フレット以下？</label>
      <input id="maxFret" type="number" min="0" max="24" value="5">
    </div>

    <div class="field" id="noteField">
      <label for="targetNote">探す音名</label>
      <select id="targetNote"></select>
    </div>

    <div class="field" id="rootField" hidden>
      <label for="rootNote">キー（主音）</label>
      <select id="rootNote"></select>
    </div>

    <div class="field" id="scaleField" hidden>
      <label for="scaleType">スケール</label>
      <select id="scaleType">
        <option value="major">メジャー</option>
        <option value="minor">ナチュラルマイナー</option>
        <option value="harmonicMinor">ハーモニックマイナー</option>
      </select>
    </div>
  </div>

  <div id="question">音名を探すモード</div>
  <div id="instructions">指定された音がある位置を、指板上ですべて選択してください。</div>

  <div class="fretHeader" id="fretHeader"></div>
  <div id="boardWrap"><div id="board"></div></div>

  <div class="actions">
    <button id="checkBtn">答え合わせ</button>
    <button id="newBtn">新しい問題</button>
    <button id="showBtn">答えを表示</button>
  </div>

  <div id="status" aria-live="polite"></div>
  <div id="noteChoices"></div>
  <p class="hint">指板はTAB譜と同じ並びで、上から1弦、2弦……6弦です。横にスクロールできます。</p>
</main>

<script>
const NOTES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const STRINGS = [
  { name: "1弦 E", midi: 64 },
  { name: "2弦 B", midi: 59 },
  { name: "3弦 G", midi: 55 },
  { name: "4弦 D", midi: 50 },
  { name: "5弦 A", midi: 45 },
  { name: "6弦 E", midi: 40 }
];
const SCALES = {
  major: {
    name: "メジャー",
    intervals: [0,2,4,5,7,9,11]
  },
  minor: {
    name: "ナチュラルマイナー",
    intervals: [0,2,3,5,7,8,10]
  },
  harmonicMinor: {
    name: "ハーモニックマイナー",
    intervals: [0,2,3,5,7,8,11]
  }
};

const board = document.getElementById("board");
const header = document.getElementById("fretHeader");
const status = document.getElementById("status");
const question = document.getElementById("question");
const instructions = document.getElementById("instructions");
const maxFretInput = document.getElementById("maxFret");
const targetNoteSelect = document.getElementById("targetNote");
const rootSelect = document.getElementById("rootNote");
const scaleSelect = document.getElementById("scaleType");

let mode = "note";
let selected = new Set();
let answerSet = new Set();
let answered = false;
let currentNote = "E";

function fillSelect(select) {
  NOTES.forEach(note => {
    const option = document.createElement("option");
    option.value = note;
    option.textContent = note;
    select.appendChild(option);
  });
}
fillSelect(targetNoteSelect);
fillSelect(rootSelect);
targetNoteSelect.value = "E";
rootSelect.value = "C";

function maxFret() {
  const value = Number.parseInt(maxFretInput.value, 10);
  if (!Number.isFinite(value)) return 5;
  return Math.max(0, Math.min(24, value));
}

function cellKey(stringIndex, fret) {
  return `${stringIndex}-${fret}`;
}

function pitchClass(stringIndex, fret) {
  return (STRINGS[stringIndex].midi + fret) % 12;
}

function getAnswerSet() {
  const result = new Set();
  const limit = maxFret();

  let wantedPitchClasses;
  if (mode === "note") {
    wantedPitchClasses = new Set([NOTES.indexOf(targetNoteSelect.value)]);
  } else {
    const root = NOTES.indexOf(rootSelect.value);
    const intervals = SCALES[scaleSelect.value].intervals;
    wantedPitchClasses = new Set(intervals.map(i => (root + i) % 12));
  }

  STRINGS.forEach((string, s) => {
    for (let fret = 0; fret <= limit; fret++) {
      if (wantedPitchClasses.has(pitchClass(s, fret))) {
        result.add(cellKey(s, fret));
      }
    }
  });
  return result;
}

function buildBoard() {
  board.innerHTML = "";
  header.innerHTML = "";
  header.appendChild(document.createElement("span"));

  for (let fret = 0; fret <= 24; fret++) {
    const span = document.createElement("span");
    span.textContent = fret;
    header.appendChild(span);
  }

  STRINGS.forEach((string, s) => {
    const label = document.createElement("div");
    label.className = "stringLabel";
    label.textContent = string.name;
    board.appendChild(label);

    for (let fret = 0; fret <= 24; fret++) {
      const cell = document.createElement("button");
      cell.className = "cell" + (fret === 0 ? " open" : "");
      cell.dataset.key = cellKey(s, fret);
      cell.dataset.string = s;
      cell.dataset.fret = fret;

      const note = document.createElement("span");
      note.className = "note";
      note.textContent = NOTES[pitchClass(s, fret)];
      cell.appendChild(note);

      cell.addEventListener("click", () => toggleCell(cell));
      board.appendChild(cell);
    }
  });
}

function toggleCell(cell) {
  if (answered) return;

  const fret = Number(cell.dataset.fret);
  if (fret > maxFret()) {
    status.textContent = `${maxFret()}フレット以下が問題の範囲です。`;
    return;
  }

  const key = cell.dataset.key;
  if (selected.has(key)) {
    selected.delete(key);
    cell.classList.remove("selected");
  } else {
    selected.add(key);
    cell.classList.add("selected");
  }
  status.textContent = `選択中：${selected.size}か所`;
}

function updateMode() {
  const isNote = mode === "note";
  document.getElementById("noteMode").classList.toggle("active", isNote);
  document.getElementById("scaleMode").classList.toggle("active", !isNote);
  document.getElementById("noteField").hidden = !isNote;
  document.getElementById("rootField").hidden = isNote;
  document.getElementById("scaleField").hidden = isNote;
  newQuestion();
}

function newQuestion() {
  selected.clear();
  answered = false;
  status.textContent = "";
  document.querySelectorAll(".cell").forEach(cell => {
    cell.classList.remove("selected", "correct", "wrong");
    cell.disabled = Number(cell.dataset.fret) > maxFret();
  });

  answerSet = getAnswerSet();

  if (mode === "note") {
    currentNote = targetNoteSelect.value;
    question.textContent = `${currentNote} の音をすべて探そう`;
    instructions.textContent =
      `0〜${maxFret()}フレットの範囲から、${currentNote} が鳴る位置をすべて選択してください。`;
  } else {
    const scale = SCALES[scaleSelect.value];
    question.textContent = `${rootSelect.value} ${scale.name} の音をすべて探そう`;
    instructions.textContent =
      `0〜${maxFret()}フレットの範囲から、このスケールに含まれる音をすべて選択してください。音名を見ながら考えて構いません。`;
  }

  document.getElementById("noteChoices").innerHTML = "";
  document.querySelectorAll(".cell").forEach(cell => {
    cell.style.visibility = Number(cell.dataset.fret) <= maxFret() ? "visible" : "hidden";
  });
}

function checkAnswer() {
  if (answered) return;

  const missing = [...answerSet].filter(key => !selected.has(key));
  const extra = [...selected].filter(key => !answerSet.has(key));

  document.querySelectorAll(".cell").forEach(cell => {
    cell.classList.remove("correct", "wrong");
  });

  if (missing.length === 0 && extra.length === 0) {
    status.textContent = `正解！ ${answerSet.size}か所、すべて見つかりました。`;
    status.style.color = "#72dfa0";
    answered = true;
    return;
  }

  status.style.color = "#ffb1a8";
  status.textContent =
    `まだ違います。見落とし：${missing.length}か所、余分な選択：${extra.length}か所。続けて挑戦できます。`;

  // 答え合わせ後も選択を修正できる
  missing.forEach(key => {
    const cell = board.querySelector(`[data-key="${key}"]`);
    if (cell) cell.classList.add("correct");
  });
  extra.forEach(key => {
    const cell = board.querySelector(`[data-key="${key}"]`);
    if (cell) cell.classList.add("wrong");
  });
}

function showAnswer() {
  answered = true;
  selected.clear();

  document.querySelectorAll(".cell").forEach(cell => {
    cell.classList.remove("selected", "correct", "wrong");
    if (answerSet.has(cell.dataset.key)) {
      cell.classList.add("correct");
    }
  });

  status.style.color = "#72dfa0";
  status.textContent = `正解の位置は ${answerSet.size} か所です。緑色の位置を確認してください。`;
}

document.getElementById("noteMode").addEventListener("click", () => {
  mode = "note";
  updateMode();
});
document.getElementById("scaleMode").addEventListener("click", () => {
  mode = "scale";
  updateMode();
});
document.getElementById("checkBtn").addEventListener("click", checkAnswer);
document.getElementById("newBtn").addEventListener("click", newQuestion);
document.getElementById("showBtn").addEventListener("click", showAnswer);

[targetNoteSelect, rootSelect, scaleSelect, maxFretInput].forEach(el => {
  el.addEventListener("change", () => {
    newQuestion();
  });
});

buildBoard();
newQuestion();
</script>
</body>
</html>
