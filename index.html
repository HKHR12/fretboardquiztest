```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギター指板トレーナー</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #17191e;
  color: #f1f1f1;
  font-family: system-ui, sans-serif;
}

main { max-width: 1200px; margin: auto; }
h1 { font-size: 24px; }

button, select, input {
  font: inherit;
  padding: 9px 11px;
  border-radius: 8px;
  border: 1px solid #555;
}

button {
  cursor: pointer;
  background: #343944;
  color: white;
}

button.active {
  background: #a72e3a;
  border-color: #e45b5b;
}

button:disabled { cursor: default; }

.modes {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}

.settings {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 12px;
  padding: 14px;
  margin: 14px 0;
  background: #22252c;
  border-radius: 12px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

label { font-size: 13px; color: #c3c6ce; }
input, select { background: #121419; color: white; }

#question {
  font-size: 20px;
  font-weight: 700;
  margin: 20px 0 8px;
}

#instructions {
  color: #c3c6ce;
  line-height: 1.6;
}

#boardWrap {
  overflow-x: auto;
  margin: 18px 0;
  padding-bottom: 8px;
}

#fretHeader, #board {
  display: grid;
  width: max-content;
}

#fretHeader {
  color: #d2d5dd;
  font-size: 12px;
  text-align: center;
  margin-bottom: 4px;
}

#fretHeader span {
  padding: 4px 0;
}

#board {
  grid-template-rows: repeat(6, 54px);
  background: #c49a67;
  border: 3px solid #795535;
  border-radius: 5px;
  position: relative;
}

.stringLabel {
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  background: #252932;
  font-size: 12px;
  border-bottom: 1px solid #555;
}

.cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  min-width: 0;
  min-height: 0;
  border-radius: 0;
  border-right: 1px solid #795c3c;
  border-bottom: 1px solid #795c3c;
  background: transparent;
  color: #171717;
  overflow: visible;
}

/* 開放弦とナット */
.cell.open {
  border-right: 5px solid #e4d4b6;
}

/* 指板のインレイ */
.cell.inlay::before,
.cell.double-inlay::before,
.cell.double-inlay::after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  background: #f0dfc3;
  border: 1px solid #a78b66;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 0;
}

.cell.double-inlay::before {
  top: 27%;
}

.cell.double-inlay::after {
  top: 73%;
}

/* 弦のライン */
.cell .string-line {
  position: absolute;
  z-index: 1;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: rgba(75, 58, 38, .8);
  pointer-events: none;
}

/* 音名 */
.cell .note {
  display: none;
  position: relative;
  z-index: 3;
  align-items: center;
  justify-content: center;
  width: 31px;
  height: 31px;
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  background: #e8d7b9;
  color: #24201b;
}

/* 出題位置の赤いマーカー */
.cell.target {
  background: rgba(190, 37, 47, .20);
}

.cell.target .note {
  display: flex;
  width: 35px;
  height: 35px;
  background: #e53945;
  color: white;
  border: 3px solid white;
  box-shadow: 0 0 0 3px #a71824, 0 0 14px rgba(255, 45, 60, .9);
  animation: pulse 1.3s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 3px #a71824, 0 0 10px rgba(255,45,60,.6); }
  50% { box-shadow: 0 0 0 5px #a71824, 0 0 17px rgba(255,45,60,1); }
}

/* 選択式の回答 */
.cell.selected {
  background: #397cbd;
}

.cell.selected .note {
  display: flex;
  background: #15548e;
  color: white;
}

/* 正解表示 */
.cell.correct {
  background: #398c60;
}

.cell.correct .note {
  display: flex;
  background: #246e48;
  color: white;
}

/* 誤答表示 */
.cell.wrong {
  background: #b83232;
}

.cell.wrong .note {
  display: flex;
  background: #8d2020;
  color: white;
}

.actions {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  margin: 14px 0;
}

#choices {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0;
}

#choices button { min-width: 48px; }
#status { min-height: 28px; margin: 12px 0; font-weight: 700; }

.hint {
  color: #aeb3bd;
  font-size: 13px;
  line-height: 1.6;
}

[hidden] { display: none !important; }

@media (max-width: 600px) {
  body { padding: 10px; }
  h1 { font-size: 21px; }
  .modes button { flex: 1 1 45%; }
  .settings { gap: 10px; }
}
</style>
</head>

<body>
<main>
<h1>ギター指板トレーナー</h1>

<div class="modes">
  <button data-mode="position" class="active">① 位置の音名当て</button>
  <button data-mode="find">② 音名の位置探し</button>
  <button data-mode="scaleFind">③ スケールの位置探し</button>
  <button data-mode="scaleNote">④ スケールの音名当て</button>
</div>

<div class="settings">
  <div class="field">
    <label for="maxFret">最高フレット</label>
    <input id="maxFret" type="number" min="0" max="24" value="5">
  </div>

  <div class="field" id="noteField">
    <label for="targetNote">探す音名</label>
    <select id="targetNote"></select>
  </div>

  <div class="field" id="rootField" hidden>
    <label for="rootNote">キー（主音）</label>
    <select id="rootNote"></select>
  </div>

  <div class="field" id="scaleField" hidden>
    <label for="scaleType">スケール</label>
    <select id="scaleType">
      <option value="major">メジャー</option>
      <option value="minor">ナチュラルマイナー</option>
      <option value="harmonicMinor">ハーモニックマイナー</option>
    </select>
  </div>
</div>

<div id="question"></div>
<div id="instructions"></div>

<div id="fretHeader"></div>
<div id="boardWrap"><div id="board"></div></div>

<div id="choices"></div>

<div class="actions">
  <button id="checkBtn">答え合わせ</button>
  <button id="newBtn">次の問題</button>
  <button id="showBtn">答えを表示</button>
</div>

<div id="status" aria-live="polite"></div>

<p class="hint">
  上から1弦、2弦……6弦の順です。最高フレットを変更すると、指板と番号表示の両方が連動します。赤いマーカーが出題位置、インレイがポジションの目印です。
</p>
</main>

<script>
const NOTES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];

const STRINGS = [
  { name: "1弦 E", midi: 64 },
  { name: "2弦 B", midi: 59 },
  { name: "3弦 G", midi: 55 },
  { name: "4弦 D", midi: 50 },
  { name: "5弦 A", midi: 45 },
  { name: "6弦 E", midi: 40 }
];

const SCALES = {
  major: { name: "メジャー", intervals: [0,2,4,5,7,9,11] },
  minor: { name: "ナチュラルマイナー", intervals: [0,2,3,5,7,8,10] },
  harmonicMinor: { name: "ハーモニックマイナー", intervals: [0,2,3,5,7,8,11] }
};

const $ = id => document.getElementById(id);

const board = $("board");
const header = $("fretHeader");
const status = $("status");

let mode = "position";
let selected = new Set();
let answerSet = new Set();
let target = null;
let answered = false;

function fillNotes(select) {
  NOTES.forEach(note => {
    const option = document.createElement("option");
    option.value = note;
    option.textContent = note;
    select.appendChild(option);
  });
}

fillNotes($("targetNote"));
fillNotes($("rootNote"));

$("targetNote").value = "E";
$("rootNote").value = "C";

function limitFret() {
  const n = Number.parseInt($("maxFret").value, 10);
  return Number.isFinite(n) ? Math.max(0, Math.min(24, n)) : 5;
}

function keyOf(s, f) {
  return `${s}-${f}`;
}

function pitchClass(s, f) {
  return (STRINGS[s].midi + f) % 12;
}

function noteAt(s, f) {
  return NOTES[pitchClass(s, f)];
}

function allPositions() {
  const result = [];
  for (let s = 0; s < 6; s++) {
    for (let f = 0; f <= limitFret(); f++) {
      result.push({ s, f, key: keyOf(s, f) });
    }
  }
  return result;
}

function scalePitchClasses() {
  const root = NOTES.indexOf($("rootNote").value);
  return new Set(
    SCALES[$("scaleType").value].intervals.map(i => (root + i) % 12)
  );
}

function expectedPositions() {
  const positions = allPositions();

  if (mode === "find") {
    const pc = NOTES.indexOf($("targetNote").value);
    return new Set(
      positions.filter(p => pitchClass(p.s, p.f) === pc).map(p => p.key)
    );
  }

  if (mode === "scaleFind") {
    const pcs = scalePitchClasses();
    return new Set(
      positions.filter(p => pcs.has(pitchClass(p.s, p.f))).map(p => p.key)
    );
  }

  return new Set();
}

/* フレット数に合わせて指板と番号を再生成 */
function buildBoard() {
  const max = limitFret();
  const columns = `54px repeat(${max + 1}, 42px)`;

  board.innerHTML = "";
  header.innerHTML = "";

  board.style.gridTemplateColumns = columns;
  header.style.gridTemplateColumns = columns;

  const blank = document.createElement("span");
  header.appendChild(blank);

  for (let f = 0; f <= max; f++) {
    const span = document.createElement("span");
    span.textContent = f;
    header.appendChild(span);
  }

  STRINGS.forEach((string, s) => {
    const label = document.createElement("div");
    label.className = "stringLabel";
    label.textContent = string.name;
    board.appendChild(label);

    for (let f = 0; f <= max; f++) {
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      cell.dataset.key = keyOf(s, f);
      cell.dataset.s = s;
      cell.dataset.f = f;

      if (f === 0) {
        cell.classList.add("open");
      } else if ([3,5,7,9,15,17,19,21].includes(f)) {
        cell.classList.add("inlay");
      } else if ([12,24].includes(f)) {
        cell.classList.add("double-inlay");
      }

      const stringLine = document.createElement("span");
      stringLine.className = "string-line";
      cell.appendChild(stringLine);

      const note = document.createElement("span");
      note.className = "note";
      note.textContent = "";
      cell.appendChild(note);

      cell.addEventListener("click", () => handleCell(cell));
      board.appendChild(cell);
    }
  });
}

function refreshBoard() {
  document.querySelectorAll(".cell").forEach(cell => {
    const s = Number(cell.dataset.s);
    const f = Number(cell.dataset.f);
    const key = cell.dataset.key;
    const note = cell.querySelector(".note");

    cell.classList.remove("selected", "correct", "wrong", "target");

    // 通常は音名を隠す。答え表示後のみ表示する。
    note.textContent = answered ? noteAt(s, f) : "";

    if (selected.has(key)) cell.classList.add("selected");

    if (target && target.s === s && target.f === f) {
      cell.classList.add("target");
    }
  });
}

function handleCell(cell) {
  if (answered || cell.disabled) return;

  const s = Number(cell.dataset.s);
  const f = Number(cell.dataset.f);
  const key = cell.dataset.key;

  if (mode === "position" || mode === "scaleNote") {
    status.textContent = `出題位置：${s + 1}弦 ${f}フレット`;
    return;
  }

  if (selected.has(key)) selected.delete(key);
  else selected.add(key);

  refreshBoard();
  status.textContent = `選択中：${selected.size}か所`;
}

function addNoteChoices() {
  const choices = $("choices");
  choices.innerHTML = "";

  NOTES.forEach(note => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = note;

    button.addEventListener("click", () => {
      if (answered) return;

      const correct = note === noteAt(target.s, target.f);
      answered = true;
      refreshBoard();

      status.style.color = correct ? "#72dfa0" : "#ffb1a8";
      status.textContent = correct
        ? "正解！"
        : `不正解。正解は ${noteAt(target.s, target.f)} です。`;
    });

    choices.appendChild(button);
  });
}

function updateModeUI() {
  document.querySelectorAll("[data-mode]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });

  $("noteField").hidden = mode !== "find";
  $("rootField").hidden = !["scaleFind", "scaleNote"].includes(mode);
  $("scaleField").hidden = !["scaleFind", "scaleNote"].includes(mode);

  $("checkBtn").hidden = !["find", "scaleFind"].includes(mode);
  $("choices").hidden = !["position", "scaleNote"].includes(mode);

  newQuestion();
}

function newQuestion() {
  selected.clear();
  answered = false;
  status.textContent = "";
  status.style.color = "#f1f1f1";

  // 入力値を反映してから盤面を作り直す
  buildBoard();

  const positions = allPositions();
  const randomPosition = () =>
    positions[Math.floor(Math.random() * positions.length)];

  if (mode === "position") {
    target = randomPosition();
    $("question").textContent = "この位置は何の音？";
    $("instructions").textContent =
      `${target.s + 1}弦 ${target.f}フレットの音名を選んでください。赤いマーカーが出題位置です。`;
    addNoteChoices();

  } else if (mode === "find") {
    target = null;
    $("question").textContent = `${$("targetNote").value} はどこにある？`;
    $("instructions").textContent =
      `0〜${limitFret()}フレットから、該当する位置をすべて選んでください。音名は隠されています。`;
    $("choices").innerHTML = "";

  } else if (mode === "scaleFind") {
    target = null;
    const scale = SCALES[$("scaleType").value];
    $("question").textContent =
      `${$("rootNote").value} ${scale.name} の音はどこ？`;
    $("instructions").textContent =
      `0〜${limitFret()}フレットから、スケールに含まれる音をすべて選んでください。音名は隠されています。`;
    $("choices").innerHTML = "";

  } else {
    const pcs = scalePitchClasses();
    const candidates = positions.filter(p => pcs.has(pitchClass(p.s, p.f)));
    target = candidates[Math.floor(Math.random() * candidates.length)];

    $("question").textContent = "このスケール内の音は何？";
    $("instructions").textContent =
      `${$("rootNote").value} ${SCALES[$("scaleType").value].name} の構成音です。赤いマーカーの音名を選んでください。`;
    addNoteChoices();
  }

  answerSet = expectedPositions();
  refreshBoard();
}

function checkAnswer() {
  if (answered || !["find", "scaleFind"].includes(mode)) return;

  const missing = [...answerSet].filter(key => !selected.has(key));
  const extra = [...selected].filter(key => !answerSet.has(key));

  document.querySelectorAll(".cell").forEach(cell => {
    cell.classList.remove("correct", "wrong");
  });

  if (missing.length === 0 && extra.length === 0) {
    answered = true;
    status.style.color = "#72dfa0";
    status.textContent = `正解！ ${answerSet.size}か所すべて見つかりました。`;
    refreshBoard();
    return;
  }

  status.style.color = "#ffb1a8";
  status.textContent =
    `まだ違います。見落とし ${missing.length}か所、余分な選択 ${extra.length}か所です。`;

  missing.forEach(key => {
    const cell = board.querySelector(`[data-key="${key}"]`);
    if (cell) cell.classList.add("correct");
  });

  extra.forEach(key => {
    const cell = board.querySelector(`[data-key="${key}"]`);
    if (cell) cell.classList.add("wrong");
  });
}

function showAnswer() {
  answered = true;

  if (mode === "position" || mode === "scaleNote") {
    refreshBoard();
    status.style.color = "#72dfa0";
    status.textContent = `正解は ${noteAt(target.s, target.f)} です。`;
    return;
  }

  selected.clear();
  refreshBoard();

  document.querySelectorAll(".cell").forEach(cell => {
    if (answerSet.has(cell.dataset.key)) {
      cell.classList.add("correct");
    }
  });

  status.style.color = "#72dfa0";
  status.textContent =
    `正解は ${answerSet.size}か所です。緑色の位置と表示された音名を確認してください。`;
}

document.querySelectorAll("[data-mode]").forEach(btn => {
  btn.addEventListener("click", () => {
    mode = btn.dataset.mode;
    updateModeUI();
  });
});

$("checkBtn").addEventListener("click", checkAnswer);
$("newBtn").addEventListener("click", newQuestion);
$("showBtn").addEventListener("click", showAnswer);

[
  $("targetNote"),
  $("rootNote"),
  $("scaleType"),
  $("maxFret")
].forEach(el => {
  el.addEventListener("change", newQuestion);
});

updateModeUI();
</script>
</body>
</html>
